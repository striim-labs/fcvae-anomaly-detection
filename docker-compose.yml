services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fcvae-api
    ports:
      - "8000:8000"
    environment:
      FCVAE_MODELS_ROOT: /app/models/fcvae
      FCVAE_DEVICE: cpu
    volumes:
      - ./models:/app/models:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
