[project]
name = "fcvae-anomaly-detection"
version = "1.0.0"
description = "Penny transaction anomaly detection using Frequency-enhanced Conditional VAE"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.6.0",
    "scipy>=1.10.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "pydantic>=2.5.0",
    "matplotlib>=3.7.0",
    "plotly>=5.18.0",
    "tqdm>=4.65.0",
    "rich>=13.0.0",
    "jupyter>=1.0.0",
    "ipykernel>=6.0.0",
    "rfc3987>=1.3.8",  # prevents jsonschema/jupyter startup hang on fresh clones
]

[project.optional-dependencies]
onnx = [
    "onnx>=1.17",
    "onnxruntime>=1.18",
    "onnxscript>=0.6",
]
